name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Integration tests (19 tests in scripts/test-api.ts) require a running
# wrangler dev instance with local D1/KV/R2 bindings. They are validated
# manually before deploy to avoid flaky infrastructure-dependent CI jobs.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix worker
      - run: cd frontend && npx tsc --noEmit
      - run: cd worker && npx tsc --noEmit

  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: cd frontend && npx vitest run
      - run: cd frontend && npm run build
      - name: Upload frontend build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    name: Deploy
    needs: [lint, typecheck, test-and-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - name: Generate wrangler.toml
        run: |
          cat > worker/wrangler.toml << 'TOML'
          name = "secure-drop-worker"
          main = "src/index.ts"
          compatibility_date = "2024-12-01"

          [vars]
          MAX_FILE_SIZE = "104857600"
          DEFAULT_EXPIRY = "86400"
          ALLOWED_ORIGIN = "https://drop.haijieqin.com"

          [[r2_buckets]]
          binding = "DROPS_BUCKET"
          bucket_name = "secure-drops"

          [[kv_namespaces]]
          binding = "DROPS_META"
          id = "${{ secrets.CF_KV_NAMESPACE_ID }}"

          [[d1_databases]]
          binding = "DB"
          database_name = "secure-drop-db"
          database_id = "${{ secrets.CF_D1_DATABASE_ID }}"

          [triggers]
          crons = ["0 * * * *"]
          TOML
      - name: Deploy Worker
        run: cd worker && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Deploy Pages
        run: npx wrangler pages deploy frontend/dist --project-name=secure-drop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
